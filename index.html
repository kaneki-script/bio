<head>

    <title>Канеки | Специалист по скриптам</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        
        body {
            background-color: #050000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            perspective: 1000px;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(180, 0, 0, 0.15) 0%, transparent 60%),
                        radial-gradient(circle at 80% 20%, rgba(80, 0, 0, 0.3) 0%, transparent 50%);
            z-index: -2;
            animation: bgRotate 20s linear infinite;
        }
        @keyframes bgRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255, 0, 0, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.8s cubic-bezier(0.85, 0, 0.15, 1);
        }
        
        .glitch-text {
            font-size: 24px;
            font-weight: 900;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            text-shadow: 0 0 10px #ff0000;
            animation: pulse 2s infinite;
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
        }
        .glitch-text::before { left: 2px; text-shadow: -2px 0 #00ffff; animation: glitch 3s infinite linear alternate-reverse; }
        .glitch-text::after { left: -2px; text-shadow: 2px 0 #ff00ff; animation: glitch 2s infinite linear alternate-reverse; }
        @keyframes glitch { 0% { clip: rect(10px, 9999px, 20px, 0); } 20% { clip: rect(30px, 9999px, 50px, 0); } 40% { clip: rect(50px, 9999px, 60px, 0); } 60% { clip: rect(80px, 9999px, 90px, 0); } 80% { clip: rect(20px, 9999px, 30px, 0); } 100% { clip: rect(60px, 9999px, 70px, 0); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .start-sub { color: #555; font-size: 12px; margin-top: 15px; letter-spacing: 1px; }

        .card {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 0, 0, 0.15);
            border-radius: 24px;
            padding: 40px 25px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(255, 0, 0, 0.05);
            position: relative;
            z-index: 10;
            animation: cardEntry 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes cardEntry { 
            0% { transform: translateY(50px) rotateX(-10deg); opacity: 0; } 
            100% { transform: translateY(0) rotateX(0); opacity: 1; } 
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bass-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.4) 0%, transparent 70%);
            animation: bassPulse 1s infinite alternate ease-in-out;
            pointer-events: none;
        }
        @keyframes bassPulse { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 0; } }

        .spin-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px dashed rgba(255, 0, 0, 0.5);
            animation: spinRing 8s linear infinite;
        }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        .avatar {
            position: relative;
            width: 95%;
            height: 95%;
            border-radius: 50%;
            background-image: url('https://i.imgur.com/fuqrOV9.jpeg');
            background-size: cover;
            background-position: center;
            border: 2px solid #111;
            z-index: 2;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            animation: imageSpin 20s linear infinite;
        }
        @keyframes imageSpin { 100% { transform: rotate(360deg); } }

        h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #ff4d4d, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s linear infinite;
            margin-bottom: 5px;
        }
        @keyframes textShine { to { background-position: 200% center; } }

        .status {
            font-size: 11px;
            color: #ff4d4d;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .status::before {
            content: ''; width: 6px; height: 6px;
            background: #ff4d4d; border-radius: 50%;
            box-shadow: 0 0 10px #ff4d4d;
            animation: pulse 1s infinite;
        }

        .desc {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #ff0000, #ff4d4d, #ff0000, #8b0000, #ff0000);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: descShine 4s linear infinite;
        }
        @keyframes descShine { to { background-position: 300% center; } }
        
        .desc span { 
            color: #fff; 
            -webkit-text-fill-color: #fff;
            font-weight: 900; 
            background: rgba(255,0,0,0.2); 
            padding: 2px 6px; 
            border-radius: 4px;
            border: 1px solid rgba(255,0,0,0.5);
        }

        .links { display: flex; flex-direction: column; gap: 14px; }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4), inset 0 0 10px rgba(255, 0, 0, 0.2);
            color: #fff;
            transition: all 0.3s ease;
            overflow: hidden;
            cursor: pointer;
            z-index: 1;
            text-shadow: 0 0 5px #ff0000;
        }

        .btn::after {
            content: '🩸';
            position: absolute;
            font-size: 12px;
            opacity: 0.8;
            top: 5px;
            right: 15px;
            animation: dropBlood 2s infinite;
        }
        .btn:nth-child(2)::after { top: 10px; right: 25px; animation-delay: 0.5s; }
        .btn:nth-child(3)::after { top: 8px; right: 10px; animation-delay: 1s; }
        .btn:nth-child(4)::after { top: 6px; right: 20px; animation-delay: 1.5s; }

        @keyframes dropBlood {
            0% { transform: translateY(-10px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(20px); opacity: 0; }
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: #ff0000;
            box-shadow: 0 0 20px #ff0000, inset 0 0 15px rgba(255, 0, 0, 0.5);
            background: rgba(255, 0, 0, 0.1);
        }

        .btn svg { width: 20px; height: 20px; fill: currentColor; transition: transform 0.3s; }
        .btn:hover svg { transform: scale(1.2); }

        .footer { margin-top: 35px; font-size: 11px; color: #444; font-weight: 700; letter-spacing: 1px; }
        .footer span { color: #ff0000; }
    </style>
</head>
<body>

<script>
    const bgMusic = document.getElementById('bg-music');
    const clickSound = document.getElementById('click-sound');
    const startScreen = document.getElementById('start-screen');
    let soundEnabled = false;

    function enableSound() {
        if (soundEnabled) return;
        
        bgMusic.volume = 0.4;
        bgMusic.play().catch(e => console.log("Ошибка музыки:", e));
        
        clickSound.volume = 1.0;

        startScreen.style.transform = 'translateY(-100%)';
        startScreen.style.opacity = '0';
        
        setTimeout(() => {
            startScreen.style.display = 'none';
        }, 800);
        
        soundEnabled = true;
    }

    function playClick() {
        if (soundEnabled) {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => console.log("Ошибка клика"));
        }
    }
</script>
